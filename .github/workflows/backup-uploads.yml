name: Daily uploads backup

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch: {}

jobs:
  trigger-backup:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger backup endpoint
        run: |
          curl -sf -X POST "${{ vars.RAILWAY_APP_URL }}/internal/backup-uploads" \
            -H "X-Backup-Token: ${{ secrets.BACKUP_CRON_SECRET }}"
